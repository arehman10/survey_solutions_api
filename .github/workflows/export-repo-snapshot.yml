name: Export repository snapshot

on:
  push:
    branches:
      - fix/paradata-skip-integrity

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/paradata-skip-integrity
          fetch-depth: 0

      - name: Build repository snapshot
        shell: bash
        run: |
          zip -qr /tmp/survey_solutions_api-main.zip . \
            -x '.git/*' '.github/workflows/export-repo-snapshot.yml'

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: survey-solutions-api-main
          path: /tmp/survey_solutions_api-main.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary workflow from branch
        shell: bash
        run: |
          rm .github/workflows/export-repo-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary repository export workflow'
          git push origin HEAD:fix/paradata-skip-integrity

name: Finalize paradata skip-integrity fix

on:
  push:
    branches:
      - fix/paradata-skip-integrity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/paradata-skip-integrity
          fetch-depth: 0

      - name: Apply finalizer
        shell: bash
        run: |
          set +e
          python tools/finalize_paradata_skip_integrity.py > finalize-debug.txt 2>&1
          rc=$?
          cat finalize-debug.txt
          if [ "$rc" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add finalize-debug.txt
            git commit -m 'Capture paradata finalizer diagnostics'
            git push origin HEAD:fix/paradata-skip-integrity
            exit "$rc"
          fi

      - name: Run focused regression tests
        run: |
          python -m py_compile tests/test_paradata_skip_integrity.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('tests/test_paradata_skip_integrity.py')
          spec = importlib.util.spec_from_file_location('test_paradata_skip_integrity', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tests = sorted(name for name in dir(mod) if name.startswith('test_'))
          for name in tests:
              getattr(mod, name)()
              print('PASS', name)
          print(f'{len(tests)} focused tests passed')
          PY
          cmp -s suso.ado install/suso.ado
          cmp -s suso.sthlp install/suso.sthlp
          git diff --check

      - name: Commit finalized production changes
        run: |
          rm -f finalize-debug.txt \
            tools/finalize_paradata_skip_integrity.py \
            .github/workflows/finalize-paradata-skip-integrity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize paradata skip-integrity fix and documentation'
          git push origin HEAD:fix/paradata-skip-integrity

        shell: bash
        run: |
          set +e
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/patch_paradata_skip_integrity.py 2>patch-debug.txt
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m py_compile /tmp/patch_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python /tmp/patch_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -m py_compile tests/test_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python - <<'PYTEST' >>patch-debug.txt 2>&1
import importlib.util
from pathlib import Path
p = Path('tests/test_paradata_skip_integrity.py')
spec = importlib.util.spec_from_file_location('test_paradata_skip_integrity', p)
mod = importlib.util.module_from_spec(spec)
spec.loader.exec_module(mod)
for name in sorted(n for n in dir(mod) if n.startswith('test_')):
    getattr(mod, name)()
    print(f'PASS {name}')
PYTEST
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            cmp -s suso.ado install/suso.ado
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >>patch-debug.txt 2>&1
            rc=$?
          fi
          cat patch-debug.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$rc" -ne 0 ]; then
            echo "exit_code=$rc" >> patch-debug.txt
            git add patch-debug.txt
            git commit -m 'Capture paradata skip-integrity patch diagnostics' || true
            git push origin HEAD:fix/paradata-skip-integrity
            exit "$rc"
          fi

          rm -f patch-debug.txt .github/workflows/apply-paradata-skip-integrity.yml
          git add suso.ado install/suso.ado tests/test_paradata_skip_integrity.py .github/workflows/apply-paradata-skip-integrity.yml
          git commit -m 'Fix paradata cascade integrity and final-state reporting'
          git push origin HEAD:fix/paradata-skip-integrity

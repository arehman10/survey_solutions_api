name: Apply and test paradata skip-integrity fix

on:
  push:
    branches:
      - fix/paradata-skip-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/paradata-skip-integrity
          fetch-depth: 0

      - name: Apply patch
        run: python tools/patch_paradata_skip_integrity.py

      - name: Run focused regression tests
        run: |
          python -m py_compile tools/patch_paradata_skip_integrity.py tests/test_paradata_skip_integrity.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('tests/test_paradata_skip_integrity.py')
          spec = importlib.util.spec_from_file_location('test_paradata_skip_integrity', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tests = sorted(name for name in dir(mod) if name.startswith('test_'))
          for name in tests:
              getattr(mod, name)()
              print('PASS', name)
          print(f'{len(tests)} focused tests passed')
          PY
          cmp -s suso.ado install/suso.ado
          git diff --check

      - name: Commit production patch
        run: |
          rm -f patch-debug.txt \
            tools/patch_paradata_skip_integrity.py \
            .github/workflows/apply-paradata-skip-integrity.yml \
            .github/workflows/run-paradata-skip-integrity.yml \
            .github/workflows/run-paradata-skip-integrity-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix paradata cascade integrity and final-state reporting'
          git push origin HEAD:fix/paradata-skip-integrity

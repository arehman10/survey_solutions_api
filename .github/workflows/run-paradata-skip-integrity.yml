name: Run paradata skip-integrity patch

on:
  push:
    branches:
      - fix/paradata-skip-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/paradata-skip-integrity
          fetch-depth: 0

      - name: Extract patch, apply it, and test
        shell: bash
        run: |
          set +e
          awk '
            /PATCH_GZ_B64: \|/ { capture=1; next }
            capture && /^        shell: bash/ { exit }
            capture { sub(/^            /, ""); printf "%s", $0 }
          ' .github/workflows/apply-paradata-skip-integrity.yml \
            | base64 --decode \
            | gzip --decompress > /tmp/patch_paradata_skip_integrity.py 2>patch-debug.txt
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m py_compile /tmp/patch_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python /tmp/patch_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -m py_compile tests/test_paradata_skip_integrity.py >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -c "import importlib.util; p='tests/test_paradata_skip_integrity.py'; s=importlib.util.spec_from_file_location('t',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); [(getattr(m,n)(), print('PASS '+n)) for n in sorted(x for x in dir(m) if x.startswith('test_'))]" >>patch-debug.txt 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            cmp -s suso.ado install/suso.ado
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >>patch-debug.txt 2>&1
            rc=$?
          fi
          cat patch-debug.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$rc" -ne 0 ]; then
            echo "exit_code=$rc" >> patch-debug.txt
            git add patch-debug.txt
            git commit -m 'Capture paradata skip-integrity patch diagnostics' || true
            git push origin HEAD:fix/paradata-skip-integrity
            exit "$rc"
          fi

          rm -f patch-debug.txt \
            .github/workflows/apply-paradata-skip-integrity.yml \
            .github/workflows/run-paradata-skip-integrity.yml
          git add suso.ado install/suso.ado tests/test_paradata_skip_integrity.py \
            .github/workflows/apply-paradata-skip-integrity.yml \
            .github/workflows/run-paradata-skip-integrity.yml
          git commit -m 'Fix paradata cascade integrity and final-state reporting'
          git push origin HEAD:fix/paradata-skip-integrity
